<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東華大學入學行政 AI 助理</title>
<link rel="preconnect" href="https://krbrxahyebnvjnxievjb.supabase.co" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div class="app">
  <header>
    <span class="links"><a href="#" id="newChat">新對話</a><button type="button" class="link-btn" id="qrBtn" title="顯示手機掃碼 QR Code">📱 QR Code</button><a href="staff.html">行政人員登入</a><button type="button" class="link-btn" id="themeBtn" title="切換深色／淺色模式">🌙</button></span>
    <h1>🎓 東華大學入學行政 AI 助理</h1>
    <p>第十組｜創新與知識管理　·　回答依據入學行政知識庫</p>
  </header>

  <main id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-badge">🎓</div>
      <h2>有什麼入學問題想問？</h2>
      <div class="sub">選擇下方主題快速提問，或直接輸入問題／貼上截圖</div>
      <div class="cat-tabs" id="catTabs">
        <button type="button" class="cat-tab on" data-cat="admission">📝 招生與報到</button>
        <button type="button" class="cat-tab" data-cat="fee">💰 學費與補助</button>
        <button type="button" class="cat-tab" data-cat="map">🗺️ 教學樓與地圖</button>
        <button type="button" class="cat-tab" data-cat="life">🏠 宿舍與生活</button>
      </div>
      <div class="chips" id="welcomeChips">
        <button class="chip">新生報到要準備什麼？</button>
        <button class="chip">忘記上傳畢業證書怎麼辦？</button>
        <button class="chip">新生註冊須知有哪些重要事項？</button>
      </div>
    </div>
  </main>

  <div class="img-preview" id="imgPreview" hidden></div>
  <form class="ask" id="form">
    <input type="file" id="imgFile" accept="image/png,image/jpeg,image/webp" hidden>
    <button class="img-btn" id="pickImg" type="button" title="上傳圖片提問（也可直接 Ctrl+V 貼上截圖）">📷</button>
    <button class="img-btn voice-btn" id="voiceBtn" type="button" title="語音提問（點擊說話）">🎙️</button>
    <textarea id="q" rows="1" placeholder="輸入問題或貼上截圖…"></textarea>
    <button class="primary" id="send" type="submit">送出</button>
  </form>
  <footer>AI 回答僅供參考，正式規定請以東華大學官方公告為準。</footer>
</div>

<script src="config.js?v=2"></script>
<script src="common.js?v=2"></script>
<script>
const URL_ = window.APP_CONFIG.FUNCTION_URL;
const { esc, md, cleanPreview, readImage, startSearchAnim, renderImages, bindImageCards, bindVoice, suggestFollowups, initTheme, openQrModal, showError, idleAbort } = window.APP_UI;
initTheme(document.getElementById('themeBtn'));
document.getElementById('qrBtn').onclick = () => openQrModal();
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const q = document.getElementById('q');
const send = document.getElementById('send');
const imgFile = document.getElementById('imgFile');
const imgPreview = document.getElementById('imgPreview');
let pendingImg = null;
const history = [];
const STORE_KEY = 'ndhu_chat_student';
let savedTurns = [];
const WELCOME_HTML = chat.innerHTML;

function saveTurns() {
  try { sessionStorage.setItem(STORE_KEY, JSON.stringify(savedTurns.slice(-30))); } catch {}
}

function add(role, html) {
  document.getElementById('welcome')?.remove();
  const row = document.createElement('div');
  row.className = 'msg ' + role;
  row.innerHTML = `<div class="bubble">${html}</div>`;
  chat.appendChild(row);
  row.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return row.firstChild;
}

function bindActions(bubble, answer, logId, turn) {
  const bar = document.createElement('div');
  bar.className = 'fb';
  if (logId) {
    bar.innerHTML = '<span>這則回答有幫助嗎？</span>'
      + '<button type="button" data-v="1">👍 有幫助</button>'
      + '<button type="button" data-v="0">👎 沒幫到</button>';
    if (turn?.fb !== undefined) {
      bar.querySelectorAll('button[data-v]').forEach(b => {
        b.disabled = true;
        if ((b.dataset.v === '1') === turn.fb) b.classList.add('picked');
      });
      bar.querySelector('span').textContent = turn.fb ? '謝謝回饋！' : '已記錄，我們會再補充資料！';
    } else {
      bar.querySelectorAll('button[data-v]').forEach(btn => btn.onclick = async () => {
        const helpful = btn.dataset.v === '1';
        bar.querySelectorAll('button[data-v]').forEach(b => b.disabled = true);
        btn.classList.add('picked');
        try {
          await fetch(URL_, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'feedback', id: logId, helpful }),
          });
          bar.querySelector('span').textContent = helpful ? '謝謝回饋！' : '已記錄，我們會再補充資料！';
          if (turn) { turn.fb = helpful; saveTurns(); }
        } catch {
          bar.querySelectorAll('button[data-v]').forEach(b => b.disabled = false);
          btn.classList.remove('picked');
        }
      });
    }
  }
  const cp = document.createElement('button');
  cp.type = 'button'; cp.className = 'copy-btn'; cp.textContent = '📋 複製';
  cp.onclick = async () => {
    try {
      await navigator.clipboard.writeText(answer);
      cp.textContent = '✅ 已複製';
      setTimeout(() => cp.textContent = '📋 複製', 1500);
    } catch {}
  };
  bar.appendChild(cp);
  bubble.appendChild(bar);
}

const srcPill = (s, links, extra = '') => {
  const u = links && links[s];
  return u && /^https:\/\//.test(u)
    ? `<a class="src-pill src-link" href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="打開官方原始文件">${esc(s)} ↗${extra}</a>`
    : `<span class="src-pill">${esc(s)}${extra}</span>`;
};
function renderFinal(bubble, question, data, persist = true) {
  let html = md(data.answer);
  if (data.images?.length) html += renderImages(data.images);
  if (data.sources?.length) {
    html += `<div class="sources"><span>📄 資料來源：</span>${data.sources.map(s => srcPill(s, data.links)).join('')}</div>`;
  }
  const fups = suggestFollowups(question, data.sources || [], false);
  if (fups.length) {
    html += `<div class="followups"><span class="followups-label">💡 你可能還想問：</span>${fups.map(f => `<button type="button" class="followup-chip">${esc(f)}</button>`).join('')}</div>`;
  }
  bubble.innerHTML = html;
  bindImageCards(bubble);
  bubble.querySelectorAll('.followup-chip').forEach(b => b.onclick = () => ask(b.textContent));
  let turn = data._turn;
  if (persist) {
    turn = { q: question, answer: data.answer, sources: data.sources || [], links: data.links || {}, images: data.images || [], log_id: data.log_id || null };
    savedTurns.push(turn);
    saveTurns();
  }
  bindActions(bubble, data.answer, data.log_id, turn);
  history.push({ role: 'user', content: question }, { role: 'assistant', content: data.answer });
}

function clearPendingImg() {
  pendingImg = null; imgFile.value = ''; imgPreview.hidden = true; imgPreview.innerHTML = '';
}
async function attachImage(file) {
  if (!file || !file.type.startsWith('image/')) return;
  try {
    pendingImg = await readImage(file);
    imgPreview.innerHTML = `<img src="${pendingImg.previewUrl}" alt="預覽"><span>已附加圖片（可直接送出或補充問題）</span><button type="button" id="rmImg">✕</button>`;
    imgPreview.hidden = false;
    document.getElementById('rmImg').onclick = clearPendingImg;
    q.focus();
  } catch (e) { alert(e.message); }
}
document.getElementById('pickImg').onclick = () => imgFile.click();
imgFile.onchange = () => { if (imgFile.files[0]) attachImage(imgFile.files[0]); };
q.addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items || [])].find(it => it.type.startsWith('image/'));
  if (item) { e.preventDefault(); attachImage(item.getAsFile()); }
});

async function ask(question, retryImg) {
  if (send.disabled) return;
  question = question.trim();
  const img = retryImg || pendingImg;
  if (!question && !img) return;
  if (!retryImg) clearPendingImg();
  const displayQ = question || '（已上傳圖片）';
  const userHtml = (img ? `<img class="chat-img" src="${img.previewUrl}" alt="上傳圖片">` : '') + (question ? `<div>${esc(question)}</div>` : '');
  const userBubble = add('user', userHtml);
  const bubble = add('bot', '');
  const wait = idleAbort();
  const stopAnim = startSearchAnim(bubble, { hasImage: !!img, isStaff: false });
  send.disabled = true;
  try {
    const payload = { action: 'chat', question, history: history.slice(-4), stream: true };
    if (img) payload.image = { mimeType: img.mimeType, data: img.data };
    const r = await fetch(URL_, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: wait.signal,
    });
    if (r.headers.get('content-type')?.includes('text/event-stream') && r.body) {
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '', acc = '', doneData = null;
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        wait.poke();
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() || '';
        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const ev = JSON.parse(line.slice(5).trim());
          if (ev.type === 'delta') {
            acc += ev.text;
            const preview = cleanPreview(acc);
            if (preview) { stopAnim(); bubble.innerHTML = md(preview); bubble.scrollIntoView({ block: 'end' }); }
          } else if (ev.type === 'done') {
            doneData = ev;
          } else if (ev.type === 'error') {
            throw new Error(ev.error);
          }
        }
      }
      if (!doneData) throw new Error('連線中斷，請再試一次');
      stopAnim();
      renderFinal(bubble, displayQ, doneData);
    } else {
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.status);
      stopAnim();
      renderFinal(bubble, displayQ, data);
    }
  } catch (e) {
    stopAnim();
    showError(bubble, e, () => {
      userBubble.parentElement.remove();
      bubble.parentElement.remove();
      ask(question, img);
    });
  } finally {
    wait.stop();
    stopAnim();
    send.disabled = false;
    bubble.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
}

const WELCOME_CATS = {
  admission: ['新生報到要準備什麼？', '忘記上傳畢業證書怎麼辦？', '新生註冊須知有哪些重要事項？'],
  fee: ['學雜費可以怎麼繳？', '就學貸款怎麼申請？', '學雜費減免與獎學金資格？'],
  map: ['東華校園導覽平面圖', '管理學院平面圖', '人社一館平面圖', '理工二館三樓平面圖', '圖書館三樓平面圖'],
  life: ['新生宿舍怎麼申請與進住？', '新生體檢要注意什麼？', '怎麼從志學火車站到東華？'],
};
function bindChips() {
  chat.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => ask(b.textContent)));
  chat.querySelectorAll('.cat-tab').forEach(tab => tab.addEventListener('click', () => {
    chat.querySelectorAll('.cat-tab').forEach(x => x.classList.toggle('on', x === tab));
    const list = WELCOME_CATS[tab.dataset.cat] || WELCOME_CATS.admission;
    const box = chat.querySelector('#welcomeChips');
    if (box) {
      box.innerHTML = list.map(q => `<button class="chip">${esc(q)}</button>`).join('');
      box.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => ask(b.textContent)));
    }
  }));
}
document.getElementById('newChat').addEventListener('click', e => {
  e.preventDefault();
  history.length = 0;
  savedTurns = [];
  try { sessionStorage.removeItem(STORE_KEY); } catch {}
  chat.innerHTML = WELCOME_HTML;
  bindChips();
  q.focus();
});

form.addEventListener('submit', e => { e.preventDefault(); const v = q.value; q.value = ''; q.style.height = ''; ask(v); });
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
});
q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = q.scrollHeight + 'px'; });
bindVoice(document.getElementById('voiceBtn'), q, text => { q.value = ''; q.style.height = ''; ask(text); });
bindChips();
try {
  const prev = JSON.parse(sessionStorage.getItem(STORE_KEY) || '[]');
  if (Array.isArray(prev) && prev.length) {
    savedTurns = prev;
    for (const t of savedTurns) {
      add('user', esc(t.q));
      const b = add('bot', '');
      renderFinal(b, t.q, { ...t, _turn: t }, false);
    }
  }
} catch {}
</script>
</body>
</html>
