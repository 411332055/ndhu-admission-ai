<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東華大學入學行政 AI 助理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <span class="links"><a href="#" id="newChat">新對話</a>　<a href="staff.html">行政人員登入</a></span>
    <h1>🎓 東華大學入學行政 AI 助理</h1>
    <p>第十組｜創新與知識管理　·　回答依據入學行政知識庫</p>
  </header>

  <main id="chat">
    <div class="welcome" id="welcome">
      <h2>有什麼入學問題想問？</h2>
      <div>申請入學、報到、註冊繳費……都可以問我</div>
      <div class="chips">
        <button class="chip">申請入學有幾個階段？</button>
        <button class="chip">新生報到要準備什麼？</button>
        <button class="chip">學雜費可以怎麼繳？</button>
      </div>
    </div>
  </main>

  <form class="ask" id="form">
    <textarea id="q" rows="1" placeholder="輸入你的問題，Enter 送出，Shift+Enter 換行" required></textarea>
    <button class="primary" id="send" type="submit">送出</button>
  </form>
  <footer>AI 回答僅供參考，正式規定請以東華大學官方公告為準。</footer>
</div>

<script src="config.js"></script>
<script>
const URL_ = window.APP_CONFIG.FUNCTION_URL;
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const q = document.getElementById('q');
const send = document.getElementById('send');
const history = [];
const STORE_KEY = 'ndhu_chat_student';
let savedTurns = [];
const WELCOME_HTML = chat.innerHTML;

function saveTurns() {
  try { sessionStorage.setItem(STORE_KEY, JSON.stringify(savedTurns.slice(-30))); } catch {}
}

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function linkify(s) {
  return s
    .replace(/(https?:\/\/[^\s<>）)】，。、；！？]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[^\d\/\-a-zA-Z])(0\d-\d{3,4}-?\d{3,4})/g, (_, pre, tel) => `${pre}<a href="tel:${tel.replace(/-/g, '')}">${tel}</a>`);
}
// 簡單的 Markdown：粗體、條列、段落、網址與電話自動連結
function md(text) {
  const lines = linkify(esc(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')).split('\n');
  let html = '', list = null;
  for (const raw of lines) {
    const line = raw.trim();
    const h = line.match(/^#{1,6}\s+(.*)/);
    if (h) { if (list) { html += `</${list}>`; list = null; } html += `<p><strong>${h[1]}</strong></p>`; continue; }
    const ul = line.match(/^[-*•]\s+(.*)/), ol = line.match(/^\d+[.、)]\s*(.*)/);
    const type = ul ? 'ul' : ol ? 'ol' : null;
    if (type) {
      if (list !== type) { if (list) html += `</${list}>`; html += `<${type}>`; list = type; }
      html += `<li>${(ul || ol)[1]}</li>`;
    } else {
      if (list) { html += `</${list}>`; list = null; }
      if (line) html += `<p>${line}</p>`;
    }
  }
  if (list) html += `</${list}>`;
  return html;
}

function add(role, html) {
  document.getElementById('welcome')?.remove();
  const row = document.createElement('div');
  row.className = 'msg ' + role;
  row.innerHTML = `<div class="bubble">${html}</div>`;
  chat.appendChild(row);
  row.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return row.firstChild;
}

function bindActions(bubble, answer, logId, turn) {
  const bar = document.createElement('div');
  bar.className = 'fb';
  if (logId) {
    bar.innerHTML = '<span>這則回答有幫助嗎？</span>'
      + '<button type="button" data-v="1">👍 有幫助</button>'
      + '<button type="button" data-v="0">👎 沒幫到</button>';
    if (turn?.fb !== undefined) {
      bar.querySelectorAll('button[data-v]').forEach(b => {
        b.disabled = true;
        if ((b.dataset.v === '1') === turn.fb) b.classList.add('picked');
      });
      bar.querySelector('span').textContent = turn.fb ? '謝謝回饋！' : '已記錄，我們會再補充資料！';
    } else {
      bar.querySelectorAll('button[data-v]').forEach(btn => btn.onclick = async () => {
        const helpful = btn.dataset.v === '1';
        bar.querySelectorAll('button[data-v]').forEach(b => b.disabled = true);
        btn.classList.add('picked');
        try {
          await fetch(URL_, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'feedback', id: logId, helpful }),
          });
          bar.querySelector('span').textContent = helpful ? '謝謝回饋！' : '已記錄，我們會再補充資料！';
          if (turn) { turn.fb = helpful; saveTurns(); }
        } catch {
          bar.querySelectorAll('button[data-v]').forEach(b => b.disabled = false);
          btn.classList.remove('picked');
        }
      });
    }
  }
  const cp = document.createElement('button');
  cp.type = 'button'; cp.className = 'copy-btn'; cp.textContent = '📋 複製';
  cp.onclick = async () => {
    try {
      await navigator.clipboard.writeText(answer);
      cp.textContent = '✅ 已複製';
      setTimeout(() => cp.textContent = '📋 複製', 1500);
    } catch {}
  };
  bar.appendChild(cp);
  bubble.appendChild(bar);
}

function cleanPreview(t) {
  return t.replace(/\s*[【\[]\s*(完整|部分|無資料)?\s*[】\]]?\s*$/, '').trim();
}

function renderFinal(bubble, question, data, persist = true) {
  let html = md(data.answer);
  if (data.sources?.length) html += `<div class="sources">📄 資料來源：${data.sources.map(esc).join('、')}</div>`;
  bubble.innerHTML = html;
  let turn = data._turn;
  if (persist) {
    turn = { q: question, answer: data.answer, sources: data.sources || [], log_id: data.log_id || null };
    savedTurns.push(turn);
    saveTurns();
  }
  bindActions(bubble, data.answer, data.log_id, turn);
  history.push({ role: 'user', content: question }, { role: 'assistant', content: data.answer });
}

async function ask(question) {
  question = question.trim();
  if (!question) return;
  add('user', esc(question));
  const bubble = add('bot', '<span class="typing"><span></span><span></span><span></span></span>');
  send.disabled = true;
  try {
    const r = await fetch(URL_, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'chat', question, history: history.slice(-4), stream: true }),
    });
    if (r.headers.get('content-type')?.includes('text/event-stream') && r.body) {
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '', acc = '', doneData = null;
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() || '';
        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const ev = JSON.parse(line.slice(5).trim());
          if (ev.type === 'delta') {
            acc += ev.text;
            const preview = cleanPreview(acc);
            if (preview) { bubble.innerHTML = md(preview); bubble.scrollIntoView({ block: 'end' }); }
          } else if (ev.type === 'done') {
            doneData = ev;
          } else if (ev.type === 'error') {
            throw new Error(ev.error);
          }
        }
      }
      if (!doneData) throw new Error('連線中斷，請再試一次');
      renderFinal(bubble, question, doneData);
    } else {
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.status);
      renderFinal(bubble, question, data);
    }
  } catch (e) {
    bubble.innerHTML = `<span style="color:#b3261e">${esc(String(e.message || e))}</span>`;
  } finally {
    send.disabled = false;
    bubble.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
}

function bindChips() {
  chat.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => ask(b.textContent)));
}
document.getElementById('newChat').addEventListener('click', e => {
  e.preventDefault();
  history.length = 0;
  savedTurns = [];
  try { sessionStorage.removeItem(STORE_KEY); } catch {}
  chat.innerHTML = WELCOME_HTML;
  bindChips();
  q.focus();
});

form.addEventListener('submit', e => { e.preventDefault(); const v = q.value; q.value = ''; q.style.height = ''; ask(v); });
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
});
q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = q.scrollHeight + 'px'; });
bindChips();
try {
  const prev = JSON.parse(sessionStorage.getItem(STORE_KEY) || '[]');
  if (Array.isArray(prev) && prev.length) {
    savedTurns = prev;
    for (const t of savedTurns) {
      add('user', esc(t.q));
      const b = add('bot', '');
      renderFinal(b, t.q, { ...t, _turn: t }, false);
    }
  }
} catch {}
</script>
</body>
</html>
