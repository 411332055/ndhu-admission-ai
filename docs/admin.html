<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知識庫管理｜東華大學入學行政 AI 助理</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>
<div class="app">
  <header>
    <span class="links"><a href="index.html">學生端</a>　<a href="staff.html">行政人員端</a></span>
    <h1>📚 知識庫管理</h1>
    <p>新增、更新、刪除入學行政知識；查看使用者問了什麼、哪些問題答不出來</p>
  </header>
  <main>
    <section class="panel">
      <h2>管理密碼</h2>
      <div class="row">
        <input type="password" id="key" placeholder="輸入 ADMIN_KEY" style="flex:1">
        <button class="primary" id="login">登入</button>
      </div>
      <div class="status" id="loginStatus"></div>
    </section>

    <section class="panel">
      <h2>新增 / 更新知識</h2>
      <label>上傳檔案（.txt .md .pdf .docx .png .jpg .webp，可多選；檔名會當作來源名稱）</label>
      <input type="file" id="files" multiple accept=".txt,.md,.pdf,.docx,.png,.jpg,.jpeg,.webp">
      <label>開放對象</label>
      <select id="aud1" class="aud"><option value="public">公開：學生、家長都查得到（官方規定、公告）</option><option value="staff">內部：只有行政人員登入後查得到（作業流程、經驗、例外處理）</option></select>
      <label>或直接貼上文字</label>
      <input type="text" id="source" placeholder="來源名稱，例如：115學年度申請入學簡章">
      <textarea id="text" placeholder="貼上入學規定、FAQ、公告內容……"></textarea>
      <div class="row">
        <button class="primary" id="upload">上傳到知識庫</button>
        <span class="status" id="upStatus">同名來源會自動覆蓋（等於更新）</span>
      </div>
    </section>

    <section class="panel">
      <h2>從網址匯入（學校公告、PDF、圖片）</h2>
      <label>網址（PDF、網頁或圖片，一行一個；可在網址後面加「 | 來源名稱」）</label>
      <textarea id="urls" style="min-height:90px" placeholder="https://aa.ndhu.edu.tw/....pdf | 115學年度新生註冊須知"></textarea>
      <label>開放對象</label>
      <select id="aud2" class="aud"><option value="public">公開</option><option value="staff">內部（只限行政人員）</option></select>
      <div class="row">
        <button class="primary" id="importUrls">匯入</button>
        <span class="status" id="urlStatus">PDF 由 Gemini 轉成文字，每份約 10～60 秒</span>
      </div>
    </section>

    <section class="panel">
      <h2>知識來源 <button class="ghost" id="refresh" style="float:right">重新整理</button></h2>
      <div class="status" id="srcSummary"></div>
      <div class="filter-bar">
        <input type="text" id="srcSearch" placeholder="搜尋來源名稱…">
        <select id="srcFilter" class="aud">
          <option value="all">全部對象</option>
          <option value="public">只看公開</option>
          <option value="staff">只看內部 🔒</option>
        </select>
      </div>
      <table><thead><tr><th>來源</th><th>對象</th><th>段數</th><th>更新時間</th><th></th></tr></thead>
        <tbody id="srcList"><tr><td colspan="5" class="status">請先登入</td></tr></tbody></table>
    </section>

    <section class="panel">
      <h2>行政人員經驗筆記審核</h2>
      <div class="status" id="noteSummary">請先登入。通過的筆記會加入「內部」知識庫，只有行政人員查得到。</div>
      <div id="noteList"></div>
    </section>

    <section class="panel">
      <h2>問答紀錄與知識缺口</h2>
      <div class="status" id="statSummary">請先登入</div>
      <div class="tabs-row" style="display:flex;align-items:center;gap:8px">
        <label style="margin:0"><input type="checkbox" id="gapOnly" checked> 只看待補缺口</label>
        <button class="ghost" id="exportCsv" style="margin-left:auto" disabled>匯出 CSV</button>
      </div>
      <table><thead><tr><th>問題</th><th>狀態</th><th>時間</th><th></th></tr></thead>
        <tbody id="logList"></tbody></table>
    </section>
  </main>
</div>

<script src="config.js"></script>
<script>
const URL_ = window.APP_CONFIG.FUNCTION_URL;
const $ = id => document.getElementById(id);
let KEY = '';
try { KEY = sessionStorage.getItem('admin_key') || ''; $('key').value = KEY; } catch {}
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = t => new Date(t).toLocaleString('zh-TW', { hour12: false });
function status(el, msg, cls = '') { $(el).className = 'status ' + cls; $(el).textContent = msg; }

async function api(body) {
  const r = await fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, admin_key: KEY }) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

let allSources = [];
function renderSources() {
  const kw = $('srcSearch').value.trim().toLowerCase();
  const f = $('srcFilter').value;
  const totalChunks = allSources.reduce((s, x) => s + Number(x.chunks || 0), 0);
  const pub = allSources.filter(x => x.audience !== 'staff').length;
  const stf = allSources.length - pub;
  status('srcSummary', `共 ${allSources.length} 份來源（公開 ${pub}、內部 ${stf}），合計 ${totalChunks} 段。`);
  const list = allSources
    .filter(s => (f === 'all' || s.audience === f) && (!kw || s.source.toLowerCase().includes(kw)))
    .sort((a, b) => b.updated.localeCompare(a.updated));
  $('srcList').innerHTML = list.length ? list.map(s =>
    `<tr><td>${esc(s.source)}</td>
     <td><button class="ghost aud-btn ${s.audience === 'staff' ? 'staff' : ''}" data-aud="${esc(s.source)}" data-cur="${s.audience}" title="點一下切換">${s.audience === 'staff' ? '🔒 內部' : '公開'}</button></td>
     <td>${s.chunks}</td><td>${fmt(s.updated)}</td>
     <td><button class="ghost" data-del="${esc(s.source)}">刪除</button></td></tr>`).join('')
    : `<tr><td colspan="5" class="status">${allSources.length ? '沒有符合條件的來源' : '知識庫目前是空的'}</td></tr>`;
  document.querySelectorAll('[data-aud]').forEach(b => b.onclick = async () => {
    const to = b.dataset.cur === 'staff' ? 'public' : 'staff';
    if (!confirm(`把「${b.dataset.aud}」改成${to === 'staff' ? '內部（學生查不到）' : '公開（學生查得到）'}？`)) return;
    await api({ action: 'set_audience', source: b.dataset.aud, audience: to }); loadSources();
  });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm(`確定刪除「${b.dataset.del}」？`)) return;
    await api({ action: 'delete', source: b.dataset.del }); loadSources();
  });
}
async function loadSources() {
  const { sources } = await api({ action: 'list' });
  allSources = sources;
  renderSources();
}
$('srcSearch').oninput = renderSources;
$('srcFilter').onchange = renderSources;

let lastLogs = [];
async function loadStats() {
  const d = await api({ action: 'stats' });
  lastLogs = d.recent || [];
  $('exportCsv').disabled = !lastLogs.length;
  const fbText = (d.helpfulYes || d.helpfulNo) ? `；使用者回饋 👍 ${d.helpfulYes || 0}、👎 ${d.helpfulNo || 0}` : '';
  status('statSummary', `最近 ${d.total} 則提問中，有 ${d.unanswered} 則待補充（部分回答、無資料或回報沒幫到）${d.blocked ? `，攔截 ${d.blocked} 則安全提問` : ''}${fbText}。點問題可看 AI 的回答；補好資料後按「已補充」。`);
  const label = { full: ['已回答', 'ok'], partial: ['部分回答', 'warn'], none: ['知識缺口', ''], blocked: ['🛡️ 已攔截', 'staff'] };
  const rows = $('gapOnly').checked ? d.gaps : d.recent;
  $('logList').innerHTML = rows.length ? rows.map(r => {
    const [t, c] = label[r.status] || label.full;
    const isGap = r.status === 'partial' || r.status === 'none' || r.helpful === false;
    const btn = !isGap || r.status === 'blocked' ? '' : r.resolved
      ? `<button class="ghost" data-undo="${r.id}">取消已補</button>`
      : `<button class="ghost" data-res="${r.id}">已補充</button>`;
    const fb = r.helpful === true ? ' <span class="tag ok">👍 有幫助</span>'
      : r.helpful === false ? ' <span class="tag">👎 沒幫到</span>' : '';
    return `<tr><td><details><summary>${r.role === 'staff' ? '<span class="tag staff">行政</span> ' : ''}${esc(r.question)}</summary><div class="ans">${esc(r.answer || '')}</div></details></td>
      <td><span class="tag ${c}">${r.resolved && r.status !== 'blocked' ? '已補充' : t}</span>${fb}</td><td>${fmt(r.created_at)}</td><td>${btn}</td></tr>`;
  }).join('') : '<tr><td colspan="4" class="status">目前沒有待補的缺口 🎉</td></tr>';
  document.querySelectorAll('[data-res],[data-undo]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    await api({ action: 'resolve_gap', id: Number(b.dataset.res || b.dataset.undo), resolved: !!b.dataset.res });
    loadStats();
  });
}
$('gapOnly').onchange = () => loadStats();
$('exportCsv').onclick = () => {
  if (!lastLogs.length) return;
  const csvCell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const stMap = { full: '已回答', partial: '部分回答', none: '知識缺口', blocked: '已攔截' };
  const head = ['時間', '角色', '問題', 'AI回答', '狀態', '已補充', '使用者回饋'];
  const lines = [head.map(csvCell).join(',')];
  for (const r of lastLogs) {
    const fb = r.helpful === true ? '有幫助' : r.helpful === false ? '沒幫到' : '';
    lines.push([fmt(r.created_at), r.role === 'staff' ? '行政' : '學生', r.question, r.answer || '', stMap[r.status] || r.status, r.resolved ? '是' : '否', fb].map(csvCell).join(','));
  }
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ndhu-chat-logs-${new Date().toISOString().slice(0, 10).replace(/-/g, '')}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

async function loadNotes() {
  const { notes } = await api({ action: 'notes' });
  const pending = notes.filter(n => n.status === 'pending');
  status('noteSummary', `待審核 ${pending.length} 則，共 ${notes.length} 則。通過的筆記會加入「內部」知識庫，只有行政人員查得到。`);
  const label = { pending: ['待審核', 'warn'], approved: ['已通過', 'ok'], rejected: ['未採用', ''] };
  $('noteList').innerHTML = notes.map(n => {
    const [t, c] = label[n.status];
    return `<div class="note"><div class="note-head"><span class="tag ${c}">${t}</span> <b>${esc(n.title)}</b>
      <span class="status">${n.author ? esc(n.author) + '・' : ''}${fmt(n.created_at)}</span></div>
      <div class="ans">${esc(n.content)}</div>
      ${n.status === 'pending' ? `<div class="row"><button class="primary" data-ok="${n.id}">通過，加入內部知識庫</button>
        <button class="ghost" data-no="${n.id}">不採用</button></div>` : ''}</div>`;
  }).join('') || '<div class="status">還沒有人分享筆記</div>';
  document.querySelectorAll('[data-ok],[data-no]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api({ action: 'review_note', id: Number(b.dataset.ok || b.dataset.no), approve: !!b.dataset.ok }); }
    catch (e) { alert(e.message); }
    loadNotes(); loadSources();
  });
}

async function login() {
  KEY = $('key').value.trim();
  try { sessionStorage.setItem('admin_key', KEY); } catch {}
  try { await loadSources(); await loadStats(); await loadNotes(); status('loginStatus', '已登入', 'ok'); }
  catch (e) { status('loginStatus', e.message, 'err'); }
}

async function readFile(f) {
  const ext = f.name.split('.').pop().toLowerCase();
  if (ext === 'pdf') {
    const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
    let out = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const c = await (await pdf.getPage(i)).getTextContent();
      out += c.items.map(it => it.str + (it.hasEOL ? '\n' : '')).join('') + '\n';
    }
    return out;
  }
  if (ext === 'docx') return (await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() })).value;
  return await f.text();
}

const IMG_EXT = new Set(['png', 'jpg', 'jpeg', 'webp']);
function readImageBase64(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const maxDim = 2048;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        const s = maxDim / Math.max(w, h);
        w = Math.round(w * s); h = Math.round(h * s);
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const mimeType = file.type === 'image/png' && file.size < 2 * 1024 * 1024 ? 'image/png' : 'image/jpeg';
      const dataUrl = c.toDataURL(mimeType, 0.88);
      resolve({ mimeType, data: dataUrl.split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('圖片讀取失敗')); };
    img.src = url;
  });
}

async function upload() {
  $('upload').disabled = true;
  try {
    const jobs = [];
    for (const f of $('files').files) jobs.push({ source: f.name.replace(/\.[^.]+$/, ''), file: f });
    if ($('text').value.trim()) {
      if (!$('source').value.trim()) throw new Error('貼上文字時請填來源名稱');
      jobs.push({ source: $('source').value.trim(), text: $('text').value });
    }
    if (!jobs.length) throw new Error('請選檔案或貼上文字');
    for (const [i, j] of jobs.entries()) {
      const ext = j.file ? j.file.name.split('.').pop().toLowerCase() : '';
      if (j.file && IMG_EXT.has(ext)) {
        status('upStatus', `辨識圖片文字中 ${i + 1}/${jobs.length}：${j.source}…`);
        const { mimeType, data } = await readImageBase64(j.file);
        const r = await api({ action: 'ingest_image', source: j.source, mimeType, data, audience: $('aud1').value });
        status('upStatus', `「${r.source}」已從圖片辨識並加入（${r.chars} 字、共 ${r.chunks} 段）`, 'ok');
      } else {
        status('upStatus', `處理中 ${i + 1}/${jobs.length}：${j.source}…`);
        const text = j.text ?? await readFile(j.file);
        if (!text.trim()) throw new Error(`「${j.source}」讀不到文字（可能是掃描檔）`);
        const r = await api({ action: 'ingest', source: j.source, text, audience: $('aud1').value });
        status('upStatus', `「${r.source}」已加入，共 ${r.chunks} 段`, 'ok');
      }
    }
    $('files').value = ''; $('text').value = ''; $('source').value = '';
    loadSources();
  } catch (e) { status('upStatus', e.message, 'err'); }
  finally { $('upload').disabled = false; }
}

// 大型 PDF：先上傳到 Gemini，再每 10 頁轉一次文字，直到沒有下一頁
async function bigPdf(url, source, i, n) {
  status('urlStatus', `匯入中 ${i + 1}/${n}：${source}（大型 PDF，上傳中…）`);
  const { fileUri } = await api({ action: 'pdf_prepare', url });
  let chunks = 0, truncated = false;
  for (let from = 1; from <= 300; from += 10) {
    status('urlStatus', `匯入中 ${i + 1}/${n}：${source}（第 ${from}-${from + 9} 頁…）`);
    const r = await api({ action: 'pdf_part', fileUri, url, source, from, to: from + 9, audience: $('aud2').value });
    if (r.empty) break;
    chunks += r.chunks; truncated = truncated || r.truncated;
  }
  if (!chunks) throw new Error('讀不到內容');
  return { source, chunks, truncated };
}

async function importUrls() {
  const lines = $('urls').value.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return status('urlStatus', '請貼上至少一個網址', 'err');
  $('importUrls').disabled = true;
  const done = [], failed = [];
  for (const [i, line] of lines.entries()) {
    const [url, name] = line.split('|').map(s => s.trim());
    const source = name || decodeURIComponent(url.split('/').pop().split('?')[0]).replace(/\.[^.]+$/, '') || url;
    status('urlStatus', `匯入中 ${i + 1}/${lines.length}：${source}…`);
    try {
      let r;
      try { r = await api({ action: 'ingest_url', url, source, audience: $('aud2').value }); }
      catch (e) {
        // PDF 太大或一次轉太久（逾時）→ 改用分段匯入；下載失敗、密碼錯誤則直接回報
        const msg = String(e.message);
        if (!/\.pdf($|\?)/i.test(url) || /下載失敗|管理密碼/.test(msg)) throw e;
        r = await bigPdf(url, source, i, lines.length);
      }
      done.push(`${r.source}（${r.chunks} 段${r.truncated ? '，內容太長只匯入前段' : ''}）`);
    } catch (e) { failed.push(`${source}：${e.message}`); }
  }
  status('urlStatus', `完成 ${done.length} 份${failed.length ? `，失敗 ${failed.length} 份：${failed.join('；')}` : ''}`, failed.length ? 'err' : 'ok');
  $('importUrls').disabled = false;
  loadSources();
}

$('login').onclick = login;
$('importUrls').onclick = importUrls;
$('key').onkeydown = e => { if (e.key === 'Enter') login(); };
$('upload').onclick = upload;
$('refresh').onclick = () => { loadSources(); loadStats(); loadNotes(); };
if (KEY) login();
</script>
</body>
</html>
