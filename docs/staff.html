<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="東華行政AI">
<meta name="theme-color" content="#10241a">
<title>行政人員端｜東華大學入學行政 AI 助理</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://krbrxahyebnvjnxievjb.supabase.co" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body class="staff">
<div class="app">
  <header>
    <span class="links"><a href="index.html">學生端</a><a href="#" id="logout" hidden>登出</a><button type="button" class="link-btn" id="themeBtn" title="切換深色／淺色模式">🌙</button></span>
    <h1>🗂️ 入學行政 AI 助理｜行政人員端</h1>
    <p>內部作業知識・學生常見問題・經驗分享</p>
  </header>

  <!-- 登入 -->
  <main id="loginPane">
    <section class="panel">
      <h2>行政人員登入</h2>
      <div class="status">這裡的內容包含內部作業資料，只開放處理入學業務的行政人員使用。</div>
      <form class="row" id="loginForm">
        <input type="password" id="key" aria-label="行政人員密碼" autocomplete="current-password" placeholder="行政人員密碼" style="flex:1">
        <button class="primary" id="login" type="submit">登入</button>
      </form>
      <div class="status" id="loginStatus"></div>
    </section>
  </main>

  <div id="app" hidden>
    <nav class="tabs">
      <button data-tab="ask" class="on">內部問答</button>
      <button data-tab="top">學生常問 Top 10</button>
      <button data-tab="note">分享經驗</button>
      <button type="button" id="newChat" class="new-chat">新對話</button>
    </nav>

    <!-- 內部問答 -->
    <div class="pane" id="pane-ask">
      <main id="chat">
        <div class="welcome" id="welcome">
          <div class="welcome-badge">🗂️</div>
          <h2>行政作業上有什麼要查？</h2>
          <div class="sub">會同時查內部作業知識（🔒）與公開規定</div>
          <div class="chips">
            <button class="chip">學生錯過報到資料上傳期限怎麼處理？</button>
            <button class="chip">新生最常打電話問什麼？</button>
            <button class="chip">延誤繳費的處理流程？</button>
          </div>
        </div>
      </main>
      <div class="img-preview" id="imgPreview" hidden></div>
      <form class="ask" id="form">
        <input type="file" id="imgFile" accept="image/png,image/jpeg,image/webp" hidden>
        <button class="img-btn" id="pickImg" type="button" title="上傳圖片提問（也可直接 Ctrl+V 貼上截圖）">📷</button>
        <button class="img-btn voice-btn" id="voiceBtn" type="button" title="語音提問（點擊說話）">🎙️</button>
        <textarea id="q" rows="1" placeholder="輸入問題或貼上截圖…"></textarea>
        <button class="primary" id="send" type="submit">送出</button>
      </form>
    </div>

    <!-- 熱門問題 -->
    <div class="pane" id="pane-top" hidden>
      <main>
        <div class="row" style="margin:0 0 12px">
          <span class="status" id="topStatus">載入中…</span>
          <button class="ghost" id="topRefresh" style="margin-left:auto">重新統計</button>
        </div>
        <div id="topList"></div>
      </main>
    </div>

    <!-- 分享經驗 -->
    <div class="pane" id="pane-note" hidden>
      <main>
        <section class="panel">
          <h2>把處理經驗寫下來</h2>
          <div class="status">例如：某類例外怎麼處理、要會辦哪個單位、學生常誤解的地方。經管理者審核後會加入內部知識庫，之後的同事就查得到。<b>請不要寫任何學生的姓名、學號等個人資料。</b></div>
          <label>標題</label>
          <input type="text" id="nTitle" placeholder="例如：錯過報到資料上傳期限的補件方式">
          <label>內容</label>
          <textarea id="nContent" placeholder="情境、處理步驟、注意事項、聯絡窗口……"></textarea>
          <label>分享者（選填）</label>
          <input type="text" id="nAuthor" placeholder="例如：綜合業務組">
          <div class="row">
            <button class="primary" id="nSend">送出審核</button>
            <span class="status" id="nStatus"></span>
          </div>
        </section>
      </main>
    </div>
  </div>
  <footer>AI 回答僅供參考，正式規定請以東華大學官方公告為準。</footer>
</div>

<script src="config.js?v=9"></script>
<script src="common.js?v=9"></script>
<script>
const URL_ = window.APP_CONFIG.FUNCTION_URL;
const { esc, md, cleanPreview, readImage, startSearchAnim, renderImages, bindImageCards, bindVoice, suggestFollowups, initTheme, showError, idleAbort, warmup } = window.APP_UI;
initTheme(document.getElementById('themeBtn'));
warmup(URL_);
const $ = id => document.getElementById(id);
let KEY = '';
try { KEY = sessionStorage.getItem('staff_key') || ''; } catch {}
const history = [];
const STORE_KEY = 'ndhu_chat_staff';
let savedTurns = [];
function saveTurns() {
  try { sessionStorage.setItem(STORE_KEY, JSON.stringify(savedTurns.slice(-30))); } catch {}
}

const fmt = t => t ? new Date(t).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

async function api(body) {
  const r = await fetch(URL_, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, staff_key: KEY }),
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw new Error(d.error || '請重新登入'); }
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
}

// ── 登入 ──
async function login() {
  KEY = $('key').value.trim() || KEY;
  if (!KEY) return;
  $('loginStatus').textContent = '驗證中…';
  try {
    await api({ action: 'staff_login' });
    try { sessionStorage.setItem('staff_key', KEY); } catch {}
    $('loginPane').hidden = true; $('app').hidden = false; $('logout').hidden = false;
    restoreTurns();
  } catch (e) { $('loginStatus').textContent = e.message; $('loginStatus').className = 'status err'; }
}
function logout() {
  KEY = '';
  history.length = 0; savedTurns = []; restored = false;
  try { sessionStorage.removeItem('staff_key'); sessionStorage.removeItem(STORE_KEY); } catch {}
  chat.innerHTML = WELCOME_HTML; bindChips();
  $('loginPane').hidden = false; $('app').hidden = true; $('logout').hidden = true;
}
$('loginForm').onsubmit = e => { e.preventDefault(); login(); };
$('logout').onclick = e => { e.preventDefault(); logout(); };

// ── 分頁 ──
let topLoaded = false;
document.querySelectorAll('.tabs button[data-tab]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button[data-tab]').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.pane').forEach(p => p.hidden = p.id !== 'pane-' + b.dataset.tab);
  $('newChat').hidden = b.dataset.tab !== 'ask';
  if (b.dataset.tab === 'top' && !topLoaded) loadTop();
});

// ── 內部問答 ──
const chat = $('chat'), form = $('form'), q = $('q'), send = $('send');
const WELCOME_HTML = chat.innerHTML;
function add(role, html) {
  $('welcome')?.remove();
  const row = document.createElement('div');
  row.className = 'msg ' + role;
  row.innerHTML = `<div class="bubble">${html}</div>`;
  chat.appendChild(row);
  row.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return row.firstChild;
}
const srcPill = (s, links, extra = '') => {
  const u = links && links[s];
  return u && /^https:\/\//.test(u)
    ? `<a class="src-pill src-link" href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="打開官方原始文件">${esc(s)} ↗${extra}</a>`
    : `<span class="src-pill">${esc(s)}${extra}</span>`;
};
function renderFinal(bubble, question, d, persist = true) {
  let html = md(d.answer);
  if (d.images?.length) html += renderImages(d.images);
  if (d.sources?.length) html += `<div class="sources"><span>📄 資料來源：</span>${d.sources.map(s =>
    srcPill(s, d.links, d.internal?.includes(s) ? '<span class="badge-int">🔒 內部</span>' : '')).join('')}</div>`;
  const fups = suggestFollowups(question, d.sources || [], true);
  if (fups.length) {
    html += `<div class="followups"><span class="followups-label">💡 延伸查詢：</span>${fups.map(f => `<button type="button" class="followup-chip">${esc(f)}</button>`).join('')}</div>`;
  }
  bubble.innerHTML = html;
  bindImageCards(bubble);
  bubble.querySelectorAll('.followup-chip').forEach(b => b.onclick = () => ask(b.textContent));
  const bar = document.createElement('div');
  bar.className = 'fb';
  const cp = document.createElement('button');
  cp.type = 'button'; cp.className = 'copy-btn'; cp.textContent = '📋 複製回答';
  cp.onclick = async () => {
    try {
      await navigator.clipboard.writeText(d.answer);
      cp.textContent = '✅ 已複製';
      setTimeout(() => cp.textContent = '📋 複製回答', 1500);
    } catch {}
  };
  bar.appendChild(cp);
  bubble.appendChild(bar);
  if (persist) {
    savedTurns.push({ q: question, answer: d.answer, sources: d.sources || [], links: d.links || {}, images: d.images || [], internal: d.internal || [] });
    saveTurns();
  }
  history.push({ role: 'user', content: question }, { role: 'assistant', content: d.answer });
}
let restored = false;
function restoreTurns() {
  if (restored) return;
  restored = true;
  try {
    const prev = JSON.parse(sessionStorage.getItem(STORE_KEY) || '[]');
    if (Array.isArray(prev) && prev.length) {
      savedTurns = prev;
      for (const t of savedTurns) {
        add('user', esc(t.q));
        const b = add('bot', '');
        renderFinal(b, t.q, t, false);
      }
    }
  } catch {}
}
const imgFile = $('imgFile'), imgPreview = $('imgPreview');
let pendingImg = null;
function clearPendingImg() {
  pendingImg = null; imgFile.value = ''; imgPreview.hidden = true; imgPreview.innerHTML = '';
}
async function attachImage(file) {
  if (!file || !file.type.startsWith('image/')) return;
  try {
    pendingImg = await readImage(file);
    imgPreview.innerHTML = `<img src="${pendingImg.previewUrl}" alt="預覽"><span>已附加圖片（可直接送出或補充問題）</span><button type="button" id="rmImg">✕</button>`;
    imgPreview.hidden = false;
    $('rmImg').onclick = clearPendingImg;
    q.focus();
  } catch (e) { alert(e.message); }
}
$('pickImg').onclick = () => imgFile.click();
imgFile.onchange = () => { if (imgFile.files[0]) attachImage(imgFile.files[0]); };
q.addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items || [])].find(it => it.type.startsWith('image/'));
  if (item) { e.preventDefault(); attachImage(item.getAsFile()); }
});
async function ask(question, retryImg) {
  if (send.disabled) return;
  question = question.trim();
  const img = retryImg || pendingImg;
  if (!question && !img) return;
  if (!retryImg) clearPendingImg();
  const displayQ = question || '（已上傳圖片）';
  const userHtml = (img ? `<img class="chat-img" src="${img.previewUrl}" alt="上傳圖片">` : '') + (question ? `<div>${esc(question)}</div>` : '');
  const userBubble = add('user', userHtml);
  const bubble = add('bot', '');
  const wait = idleAbort();
  const stopAnim = startSearchAnim(bubble, { hasImage: !!img, isStaff: true });
  send.disabled = true;
  try {
    const payload = { action: 'chat', question, history: history.slice(-4), staff_key: KEY, stream: true };
    if (img) payload.image = { mimeType: img.mimeType, data: img.data };
    const r = await fetch(URL_, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: wait.signal,
    });
    if (r.status === 401) { const d = await r.json().catch(() => ({})); logout(); throw new Error(d.error || '請重新登入'); }
    if (r.headers.get('content-type')?.includes('text/event-stream') && r.body) {
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '', acc = '', doneData = null;
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        wait.poke();
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() || '';
        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const ev = JSON.parse(line.slice(5).trim());
          if (ev.type === 'delta') {
            acc += ev.text;
            const preview = cleanPreview(acc);
            if (preview) { stopAnim(); bubble.innerHTML = md(preview); bubble.scrollIntoView({ block: 'end' }); }
          } else if (ev.type === 'done') {
            doneData = ev;
          } else if (ev.type === 'error') {
            throw new Error(ev.error);
          }
        }
      }
      if (!doneData) throw new Error('連線中斷，請再試一次');
      stopAnim();
      renderFinal(bubble, displayQ, doneData);
    } else {
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
      stopAnim();
      renderFinal(bubble, displayQ, d);
    }
  } catch (e) {
    stopAnim();
    showError(bubble, e, () => {
      userBubble.parentElement.remove();
      bubble.parentElement.remove();
      ask(question, img);
    });
  } finally {
    wait.stop();
    stopAnim();
    send.disabled = false;
    bubble.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
}
function bindChips() {
  chat.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => ask(b.textContent)));
}
$('newChat').onclick = () => {
  history.length = 0;
  savedTurns = [];
  try { sessionStorage.removeItem(STORE_KEY); } catch {}
  chat.innerHTML = WELCOME_HTML;
  bindChips();
  q.focus();
};
form.addEventListener('submit', e => { e.preventDefault(); const v = q.value; q.value = ''; q.style.height = ''; ask(v); });
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = q.scrollHeight + 'px'; });
bindVoice($('voiceBtn'), q, text => { q.value = ''; q.style.height = ''; ask(text); });
bindChips();

// ── 熱門問題 ──
async function loadTop(refresh = false) {
  $('topStatus').textContent = refresh ? '重新統計中（約 10 秒）…' : '載入中…';
  $('topRefresh').disabled = true;
  try {
    const d = await api({ action: 'top_questions', refresh });
    topLoaded = true;
    $('topStatus').textContent = `依學生端最近 ${d.total} 則提問歸類（統計時間 ${fmt(d.updated_at)}）`;
    $('topList').innerHTML = d.items.length ? d.items.map((it, i) => `
      <div class="top-item"><div class="rank">${i + 1}</div><div>
        <b>${esc(it.topic)}</b>
        <div class="meta">${it.count} 則提問${it.gaps ? `・<span style="color:#b3261e">${it.gaps} 則答不完整，需要補資料</span>` : '・AI 都答得出來'}・最近 ${fmt(it.last)}</div>
        <ul class="ex">${it.examples.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      </div></div>`).join('') : '<div class="status">學生端還沒有提問紀錄</div>';
  } catch (e) { $('topStatus').textContent = e.message; }
  finally { $('topRefresh').disabled = false; }
}
$('topRefresh').onclick = () => loadTop(true);

// ── 分享經驗 ──
$('nSend').onclick = async () => {
  $('nSend').disabled = true;
  try {
    await api({ action: 'submit_note', title: $('nTitle').value, content: $('nContent').value, author: $('nAuthor').value });
    $('nStatus').textContent = '已送出，謝謝分享！管理者審核後會加入內部知識庫。'; $('nStatus').className = 'status ok';
    $('nTitle').value = ''; $('nContent').value = '';
  } catch (e) { $('nStatus').textContent = e.message; $('nStatus').className = 'status err'; }
  finally { $('nSend').disabled = false; }
};

if (KEY) login();
</script>
</body>
</html>
